<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疾管局 QA 知識庫 ｜ 高雄市政府衛生局</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#f5f6fa;color:#222;font-size:16px}
a{color:#1565c0}
.marquee-bar{background:linear-gradient(90deg,#c62828,#e53935);color:#fff;padding:10px 0;overflow:hidden;white-space:nowrap}
.marquee-inner{display:inline-block;animation:mq 28s linear infinite;font-size:15px;font-weight:500;letter-spacing:.5px}
.marquee-inner span{margin-right:80px}
@keyframes mq{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.hdr{background:#fff;border-bottom:2px solid #e0e0e0;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:150;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.hdr-l{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1565c0,#0d47a1);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 2px 8px rgba(21,101,192,.25)}
.hdr h1{font-size:22px;color:#1a237e;letter-spacing:1px;font-weight:900}
.hdr p{font-size:12px;color:#90a4ae;margin-top:1px}
.btn{background:#f5f5f5;border:1px solid #ddd;border-radius:10px;padding:8px 18px;color:#555;cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.btn:hover{background:#e8eaf6;color:#1a237e;border-color:#9fa8da}
.btn-p{background:#1a237e;border:none;color:#fff;font-weight:600}.btn-p:hover{background:#283593}
.btn-d{background:#fff5f5;color:#e53935;border-color:#ffcdd2}.btn-d:hover{background:#ffebee}
.btn-s{padding:5px 12px;font-size:12px;border-radius:8px}
.wrap{display:flex;min-height:calc(100vh - 70px)}
.side{width:240px;background:#fff;border-right:2px solid #e0e0e0;padding:14px 0;overflow-y:auto;position:sticky;top:68px;height:calc(100vh - 68px);flex-shrink:0}
.side-search{padding:0 14px 14px}
.side-search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #e0e0e0;font-size:14px;font-family:inherit;outline:none;background:#fafafa}
.side-search input:focus{border-color:#1565c0;background:#fff}
.side-label{font-size:12px;color:#bbb;font-weight:700;padding:0 20px;margin-bottom:8px;letter-spacing:2px}
.side-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:15px;font-weight:500;color:#546e7a;border-left:4px solid transparent;transition:all .12s}
.side-item:hover{background:#f5f5f5;color:#222}
.side-item.on{background:#e8eaf6;color:#1a237e;border-left-color:#1a237e;font-weight:700}
.side-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.side-item .n{margin-left:auto;font-size:12px;color:#ccc;font-weight:400}
.cnt{flex:1;padding:28px 32px;min-width:0}
.cnt-hdr{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.cnt-icon{font-size:46px}
.cnt-title{font-size:28px;font-weight:900}
.cnt-count{font-size:14px;color:#9e9e9e;margin-top:2px}
.cm{background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:10px 18px;margin:12px 0 20px;overflow:hidden;white-space:nowrap;font-size:14px;color:#e65100;font-weight:500}
.cm-inner{display:inline-block;animation:mq 22s linear infinite}
.cm-inner span{margin-right:60px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:22px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#777;transition:all .12s;font-family:inherit}
.tab:hover{border-color:#90caf9;color:#1565c0}
.tab.on{background:#1a237e;border-color:#1a237e;color:#fff}
.qa{background:#fff;border-radius:16px;margin-bottom:10px;border:1.5px solid #eaeaea;overflow:hidden;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.qa:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.qa.open{border-color:#90caf9}
.qq{padding:18px 22px;cursor:pointer;display:flex;align-items:center;gap:14px}
.qq-n{font-size:13px;font-weight:700;color:#fff;border-radius:8px;padding:3px 10px;flex-shrink:0;min-width:34px;text-align:center}
.qq-t{flex:1;font-size:16px;font-weight:700;color:#263238;line-height:1.5}
.qq-a{font-size:18px;color:#bbb;transition:transform .2s;flex-shrink:0}
.qa.open .qq-a{transform:rotate(180deg);color:#1565c0}
.qa-body{padding:2px 22px 20px;border-top:1px solid #f0f0f0;font-size:15px;line-height:2;color:#444;white-space:pre-line;animation:fd .2s ease}
.qa-body img,.qa-body video,.qa-body iframe{max-width:100%;border-radius:10px;margin:12px 0;display:block}
@keyframes fd{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.s-tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;color:#fff;font-weight:600;margin-right:8px}
.empty{text-align:center;padding:60px 20px;color:#bbb;font-size:16px}
.footer{text-align:center;padding:24px;color:#bbb;font-size:13px;border-top:1px solid #eee;margin-top:16px}
.mob-cats{display:none;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #e0e0e0;-webkit-overflow-scrolling:touch}
.mob-btn{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer;font-family:inherit;flex-shrink:0;font-weight:500}
.mob-btn.on{background:#1a237e;color:#fff;border-color:#1a237e}
@media(max-width:768px){.side{display:none}.mob-cats{display:flex!important}.cnt{padding:16px}.cnt-title{font-size:22px}.hdr h1{font-size:17px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:24px;padding:48px 40px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.login-box h2{font-size:24px;margin:14px 0 22px;color:#1a237e}
.login-box input{width:100%;padding:14px;border-radius:14px;border:2px solid #e0e0e0;font-size:22px;text-align:center;letter-spacing:8px;outline:none;font-family:inherit}
.login-box input:focus{border-color:#1565c0}
.login-btns{display:flex;gap:10px;margin-top:22px}
.login-btns button{flex:1;padding:13px;border-radius:14px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700;border:none}
.adm{position:fixed;inset:0;background:#f5f6fa;z-index:500;overflow-y:auto}
.adm-top{background:#1a237e;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.adm-top h2{color:#fff;font-size:18px;font-weight:700}
.adm-top button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 16px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit}
.adm-body{max-width:880px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:#fff;border-radius:14px;padding:20px;text-align:center;border:1px solid #eee}
.stat b{font-size:32px;color:#1a237e;display:block}
.stat span{font-size:13px;color:#9e9e9e}
.mq-admin{background:#fff;border-radius:16px;border:1px solid #eee;padding:20px;margin-bottom:16px}
.mq-admin h3{font-size:16px;color:#1a237e;margin-bottom:12px}
.mq-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.mq-row input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid #e0e0e0;font-size:14px;font-family:inherit;outline:none}
.mq-row input:focus{border-color:#1565c0}
.sec{background:#fff;border-radius:16px;margin-bottom:14px;border:1px solid #eee;overflow:hidden}
.sec-hdr{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f5f5f5;background:#fafafa}
.sec-title{font-weight:700;font-size:16px;color:#1a237e}
.sec-row{padding:11px 20px;border-bottom:1px solid #f8f8f8;display:flex;align-items:center;gap:8px}
.sec-row:last-child{border-bottom:none}
.sec-row-t{flex:1;font-size:14px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.sec-row-t:hover{color:#1a237e}
.sec-row button{padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid #ddd;background:#fafafa;color:#666;font-family:inherit}
.sec-row button:hover{background:#e8eaf6;color:#1a237e}
.sec-row button.del{background:#fff5f5;color:#e53935;border-color:#ffcdd2}
.ed-box{background:#fff;border-radius:24px;padding:32px;width:92%;max-width:620px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.ed-box h3{font-size:20px;color:#1a237e;margin-bottom:18px}
.ed-box label{display:block;font-size:14px;font-weight:700;color:#555;margin-bottom:6px;margin-top:16px}
.ed-box input[type=text],.ed-box textarea,.ed-box select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e0e0e0;font-size:15px;font-family:inherit;outline:none}
.ed-box input:focus,.ed-box textarea:focus,.ed-box select:focus{border-color:#1565c0}
.ed-box textarea{min-height:180px;resize:vertical;line-height:1.8}
.ed-box select{background:#fff}
.ed-btns{display:flex;gap:10px;margin-top:24px}
.ed-btns button{flex:1;padding:14px;border-radius:14px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700;border:none}
.ed-media{margin-top:10px;display:flex;gap:8px}
.ed-media button{padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;border:1px solid #ddd;background:#fafafa;font-family:inherit;font-weight:500}
.ed-media button:hover{background:#e8eaf6}
.export-box{background:#fff;border-radius:24px;padding:32px;width:92%;max-width:680px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.export-box h3{font-size:20px;color:#1a237e;margin-bottom:10px}
.export-box p{font-size:14px;color:#777;margin-bottom:16px;line-height:1.7}
.export-box textarea{width:100%;height:300px;padding:14px;border-radius:12px;border:1.5px solid #e0e0e0;font-size:12px;font-family:'Courier New',monospace;outline:none;resize:vertical;background:#fafafa;line-height:1.5}
.export-box textarea:focus{border-color:#1565c0}
.export-btns{display:flex;gap:10px;margin-top:16px}
.export-btns button{flex:1;padding:13px;border-radius:14px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700;border:none}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
let D=JSON.parse(JSON.stringify(QA_DATA));
let S={cat:0,sub:null,q:null,search:'',showAdmin:false,auth:false,edOpen:false,edMode:'add',edCat:0,edIdx:-1,edQ:'',edA:'',edSub:'',exportOpen:false};
function R(){document.getElementById('app').innerHTML=S.showAdmin?(S.auth?adminPanel():adminLogin()):front()}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(a){
  // Keep HTML tags for img/video/iframe, escape the rest
  let safe=a.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Restore allowed tags
  safe=safe.replace(/&lt;(\/?)img(\s[^&]*?)?&gt;/gi,'<$1img$2>');
  safe=safe.replace(/&lt;(\/?)video(\s[^&]*?)?&gt;/gi,'<$1video$2>');
  safe=safe.replace(/&lt;(\/?)iframe(\s[^&]*?)?&gt;/gi,'<$1iframe$2>');
  // URLs to links
  safe=safe.replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank">$1</a>');
  return safe;
}
function getItems(c){let it=c.items.map((x,i)=>({...x,_i:i}));if(S.sub)it=it.filter(x=>x.sub===S.sub);return it}
function sResults(){let t=S.search.toLowerCase().trim();if(!t)return[];let r=[];D.categories.forEach((c,ci)=>c.items.forEach((x,xi)=>{if(x.q.toLowerCase().includes(t)||x.a.toLowerCase().includes(t))r.push({...x,_ci:ci,_xi:xi})}));return r}

function front(){
  let c=D.categories[S.cat],isS=S.search.trim().length>0,its=isS?sResults():getItems(c),cm=c.marquee||[];
  return`${D.globalMarquee&&D.globalMarquee.length?`<div class="marquee-bar"><div class="marquee-inner">${D.globalMarquee.map(t=>'<span>'+t+'</span>').join('')}${D.globalMarquee.map(t=>'<span>'+t+'</span>').join('')}</div></div>`:''}
<div class="hdr"><div class="hdr-l"><div class="logo">🏥</div><div><h1>疾管局 QA 知識庫</h1><p>高雄市政府衛生局 疾病管制處</p></div></div><button class="btn" onclick="S.showAdmin=true;R()">⚙ 後台管理</button></div>
<div class="mob-cats">${D.categories.map((x,i)=>`<button class="mob-btn ${i===S.cat&&!isS?'on':''}" onclick="S.cat=${i};S.sub=null;S.q=null;S.search='';R()">${x.icon} ${x.name}</button>`).join('')}</div>
<div class="wrap"><div class="side"><div class="side-search"><input placeholder="🔍 關鍵字搜尋..." value="${esc(S.search)}" oninput="S.search=this.value;S.q=null;R()" id="si"></div><div class="side-label">疾病分類</div>${D.categories.map((x,i)=>`<div class="side-item ${i===S.cat&&!isS?'on':''}" onclick="S.cat=${i};S.sub=null;S.q=null;S.search='';R()"><div class="dot" style="background:${x.color}"></div>${x.icon} ${x.name}<span class="n">${x.items.length}</span></div>`).join('')}</div>
<div class="cnt">${isS?searchV(its):catV(c,its,cm)}</div></div>
<div class="footer">高雄市政府衛生局 疾病管制處 ｜ 防疫專線 07-723-0250 ｜ 全國 1922</div>`}

function catV(c,its,cm){
  return`<div class="cnt-hdr"><div class="cnt-icon">${c.icon}</div><div><div class="cnt-title" style="color:${c.color}">${c.name}</div><div class="cnt-count">${its.length} 個常見問題</div></div></div>
${cm.length?`<div class="cm"><div class="cm-inner">${cm.map(t=>'<span>'+t+'</span>').join('')}${cm.map(t=>'<span>'+t+'</span>').join('')}</div></div>`:''}
${(c.subtopics||[]).length?`<div class="tabs"><div class="tab ${S.sub===null?'on':''}" onclick="S.sub=null;S.q=null;R()">全部</div>${c.subtopics.map(s=>`<div class="tab ${S.sub===s?'on':''}" onclick="S.sub='${s}';S.q=null;R()">${s}</div>`).join('')}</div>`:''}
${its.length===0?'<div class="empty">此分類目前沒有 QA 內容</div>':''}
${its.map((x,i)=>`<div class="qa ${S.q===x._i?'open':''}"><div class="qq" onclick="S.q=S.q===${x._i}?null:${x._i};R()"><span class="qq-n" style="background:${c.color}">${i+1}</span><span class="qq-t">${x.q}</span><span class="qq-a">▾</span></div>${S.q===x._i?`<div class="qa-body">${fmt(x.a)}</div>`:''}</div>`).join('')}`}

function searchV(its){
  return`<div class="cnt-hdr"><div class="cnt-icon">🔍</div><div><div class="cnt-title">搜尋結果</div><div class="cnt-count">找到 ${its.length} 筆</div></div></div>
${its.length===0?'<div class="empty">找不到相關內容，請試試其他關鍵字</div>':''}
${its.map((x,i)=>{let c=D.categories[x._ci];return`<div class="qa ${S.q===('s'+i)?'open':''}"><div class="qq" onclick="S.q=S.q==='s${i}'?null:'s${i}';R()"><span class="s-tag" style="background:${c.color}">${c.icon} ${c.name}</span><span class="qq-t">${x.q}</span><span class="qq-a">▾</span></div>${S.q===('s'+i)?`<div class="qa-body">${fmt(x.a)}</div>`:''}</div>`}).join('')}`}

function adminLogin(){return`<div class="ov"><div class="login-box"><div style="font-size:52px">🔐</div><h2>後台管理登入</h2><input type="password" id="pw" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()"><div class="login-btns"><button style="background:#f5f5f5;color:#666" onclick="S.showAdmin=false;R()">返回</button><button style="background:#1a237e;color:#fff" onclick="doLogin()">登入</button></div></div></div>`}
function doLogin(){if(document.getElementById('pw').value==='1234'){S.auth=true;R()}else alert('密碼錯誤')}

function adminPanel(){
  let total=D.categories.reduce((s,c)=>s+c.items.length,0);
  return`<div class="adm"><div class="adm-top"><h2>⚙ 後台管理</h2><div style="display:flex;gap:8px"><button onclick="S.exportOpen=true;R()">📥 匯出 data.js</button><button onclick="S.showAdmin=false;S.auth=false;R()">← 回前台</button></div></div>
<div class="adm-body"><div class="stats"><div class="stat"><b>${D.categories.length}</b><span>疾病分類</span></div><div class="stat"><b>${total}</b><span>QA 總數</span></div><div class="stat"><b style="color:#2e7d32">✓</b><span>系統正常</span></div></div>
<div class="mq-admin"><h3>📢 全站跑馬燈（最多3條）</h3>${(D.globalMarquee||[]).map((t,i)=>`<div class="mq-row"><input value="${esc(t)}" onchange="D.globalMarquee[${i}]=this.value"><button class="btn btn-s btn-d" onclick="D.globalMarquee.splice(${i},1);R()">✕</button></div>`).join('')}${(D.globalMarquee||[]).length<3?`<div class="mq-row"><input placeholder="新增跑馬燈文字..." id="ngm"><button class="btn btn-s" style="background:#e8eaf6;color:#1a237e" onclick="let v=document.getElementById('ngm').value.trim();if(v){D.globalMarquee.push(v);R()}">＋ 新增</button></div>`:''}</div>
${D.categories.map((c,ci)=>`<div class="sec"><div class="sec-hdr"><div class="sec-title">${c.icon} ${c.name}（${c.items.length}題）</div><div style="display:flex;gap:6px"><button class="btn btn-s" onclick="editCM(${ci})">📢 跑馬燈</button><button class="btn btn-s btn-p" onclick="openEd('add',${ci})">＋ 新增QA</button></div></div>${c.items.map((x,ii)=>`<div class="sec-row"><span class="sec-row-t" onclick="openEd('edit',${ci},${ii})">Q${ii+1}. ${x.q}</span><button onclick="openEd('edit',${ci},${ii})">✏</button><button class="del" onclick="if(confirm('確定刪除？')){D.categories[${ci}].items.splice(${ii},1);R()}">✕</button></div>`).join('')}</div>`).join('')}</div></div>
${S.edOpen?editor():''}${S.exportOpen?exportPanel():''}`}

function editor(){
  let c=D.categories[S.edCat],subs=c.subtopics||[];
  return`<div class="ov" onclick="if(event.target===this){S.edOpen=false;R()}"><div class="ed-box"><h3>${c.icon} ${c.name} — ${S.edMode==='add'?'新增':'編輯'} QA</h3>
<label>主題分類</label><select id="edSub">${subs.map(s=>`<option value="${s}"${S.edSub===s?' selected':''}>${s}</option>`).join('')}</select>
<label>問題</label><input type="text" id="edQ" value="${esc(S.edQ)}" placeholder="輸入問題...">
<label>答案</label><textarea id="edA" placeholder="輸入答案...">${esc(S.edA)}</textarea>
<label>附加媒體</label><div class="ed-media"><button onclick="addMedia('img')">🖼 插入圖片網址</button><button onclick="addMedia('vid')">🎬 插入影片網址</button></div>
<div class="ed-btns"><button style="background:#f5f5f5;color:#666" onclick="S.edOpen=false;R()">取消</button><button style="background:#1a237e;color:#fff" onclick="saveEd()">💾 儲存</button></div></div></div>`}

function openEd(mode,ci,ii){
  S.edOpen=true;S.edMode=mode;S.edCat=ci;S.edIdx=ii!==undefined?ii:-1;
  let c=D.categories[ci];
  if(mode==='edit'&&ii!==undefined){let x=c.items[ii];S.edQ=x.q;S.edA=x.a;S.edSub=x.sub||(c.subtopics?.[0]||'')}
  else{S.edQ='';S.edA='';S.edSub=c.subtopics?.[0]||''}
  R()}

function saveEd(){
  let q=document.getElementById('edQ').value.trim(),a=document.getElementById('edA').value.trim(),sub=document.getElementById('edSub').value;
  if(!q||!a){alert('問題和答案都要填喔！');return}
  let c=D.categories[S.edCat];
  if(S.edMode==='add')c.items.push({q,a,sub});else c.items[S.edIdx]={q,a,sub};
  S.edOpen=false;R()}

function addMedia(type){
  let ta=document.getElementById('edA');
  if(type==='img'){let u=prompt('請輸入圖片網址（https://...）：');if(u)ta.value+='\n\n<img src="'+u+'">\n'}
  else{let u=prompt('請輸入影片網址：');if(u){if(u.includes('youtube.com')||u.includes('youtu.be')){let id=u.match(/(?:v=|\/)([\w-]{11})/);if(id)ta.value+='\n\n<iframe width="560" height="315" src="https://www.youtube.com/embed/'+id[1]+'" frameborder="0" allowfullscreen></iframe>\n'}else ta.value+='\n\n<video controls src="'+u+'"></video>\n'}}}

function editCM(ci){let c=D.categories[ci],cur=(c.marquee||[]).join('\n');let v=prompt(c.name+' 的跑馬燈（每行一條，最多3條）：',cur);if(v===null)return;c.marquee=v.split('\n').map(s=>s.trim()).filter(s=>s).slice(0,3);R()}
